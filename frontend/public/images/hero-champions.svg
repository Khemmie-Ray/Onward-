<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300"><style>
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.swing{animation:swing 1.6s cubic-bezier(.6,0,.4,1) infinite}
.tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box}
.tw2{animation:tw 2.8s .6s ease-in-out infinite;transform-box:fill-box}
.tw3{animation:tw 3.2s 1.1s ease-in-out infinite;transform-box:fill-box}
.fl{animation:fl 4s ease-in-out infinite}
.fl2{animation:fl 5s 1s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.peek{animation:peek 3s ease-in-out infinite}
.ring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ring2{animation:ring 1.6s .5s ease-out infinite;transform-box:fill-box;transform-origin:center}
.drive{animation:drive 5s ease-in-out infinite}
.blink{animation:blink 3.4s infinite;transform-box:fill-box;transform-origin:center}
.shift{animation:shift 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes swing{0%,100%{transform:rotate(-28deg)}45%,60%{transform:rotate(6deg)}}
@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.4);opacity:.5}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes peek{0%,100%{transform:translateY(18px)}40%,70%{transform:translateY(0)}}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.8);opacity:0}}
@keyframes drive{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes shift{0%,30%{transform:translateX(-3px)}50%,80%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
