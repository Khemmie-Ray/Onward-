  <rect x="0" y="40" width="280" height="22" fill="#0C0722"/>
  <g class="blink"><circle cx="100" cy="51" r="8" fill="#FFFFFF"/><circle cx="102" cy="52" r="4" fill="#1B133B"/><circle cx="180" cy="51" r="8" fill="#FFFFFF"/><circle cx="182" cy="52" r="4" fill="#1B133B"/></g>
</g>
