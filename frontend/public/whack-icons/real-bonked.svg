<ellipse cx="100" cy="106" rx="11" ry="8.5" fill="#FF8FA3" stroke="#1B133B" stroke-width="4"/><ellipse cx="97" cy="103" rx="3" ry="2" fill="#FFFFFF" opacity="0.7"/>
<path d="M74 114 L50 108 M74 121 L50 124 M126 114 L150 108 M126 121 L150 124" stroke="#1B133B" stroke-width="2.6" stroke-linecap="round"/>
<path d="M86 136 Q100 126 114 136" fill="none" stroke="#1B133B" stroke-width="4" stroke-linecap="round"/>
<path d="M62 70 Q62 30 100 30 Q138 30 138 70 Q100 61 62 70Z" fill="#77C082" stroke="#1B133B" stroke-width="5" stroke-linejoin="round"/>
