<path d="M84 126 Q100 144 116 126" fill="none" stroke="#1B133B" stroke-width="4" stroke-linecap="round"/><rect x="95" y="128" width="10" height="8" rx="2" fill="#FFFFFF" stroke="#1B133B" stroke-width="2.5"/>
<path d="M62 70 Q62 30 100 30 Q138 30 138 70 Q100 61 62 70Z" fill="#77C082" stroke="#1B133B" stroke-width="5" stroke-linejoin="round"/>
