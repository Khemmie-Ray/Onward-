<g class="m-blink"><circle cx="120" cy="84" r="12" fill="#FFFFFF" stroke="#1B133B" stroke-width="4"/><circle cx="118" cy="85" r="6.5" fill="#1B133B"/><circle cx="120.5" cy="82" r="2.3" fill="#FFFFFF"/></g><ellipse cx="66" cy="110" rx="9" ry="5.5" fill="#FF8FA3" opacity="0.6"/><ellipse cx="134" cy="110" rx="9" ry="5.5" fill="#FF8FA3" opacity="0.6"/><ellipse cx="100" cy="116" rx="27" ry="19" fill="#D9A67F" stroke="#1B133B" stroke-width="4"/>
<ellipse cx="100" cy="106" rx="11" ry="8.5" fill="#FF8FA3" stroke="#1B133B" stroke-width="4"/><ellipse cx="97" cy="103" rx="3" ry="2" fill="#FFFFFF" opacity="0.7"/>
