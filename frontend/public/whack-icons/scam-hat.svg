<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Scammer mole in a mask and hat"><title>Scammer mole in a mask and hat</title><style>
.m-sway{animation:m-sway 2.6s ease-in-out infinite;transform-origin:100px 200px}
.m-sneak{animation:m-sneak 2.2s ease-in-out infinite;transform-origin:100px 200px}
.m-hop{animation:m-hop 1.4s ease-in-out infinite}
.m-blink{animation:m-blink 3.2s infinite;transform-box:fill-box;transform-origin:center}
.m-shift{animation:m-shift 1.6s ease-in-out infinite}
.m-wave{animation:m-wave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 95%}
.m-glint{animation:m-glint 2.4s ease-in-out infinite}
.m-brow{animation:m-brow 1.8s ease-in-out infinite}
.m-stache{animation:m-stache 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m-spin{animation:m-spin 1.6s linear infinite;transform-origin:100px 40px}
.m-wobble{animation:m-wobble .9s ease-in-out infinite;transform-origin:100px 200px}
.m-drop{animation:m-drop 1.4s ease-in infinite}
.m-pom{animation:m-pom 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes m-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes m-sneak{0%,100%{transform:rotate(0) translateX(0)}35%{transform:rotate(-4deg) translateX(-3px)}70%{transform:rotate(3deg) translateX(2px)}}
@keyframes m-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
@keyframes m-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes m-shift{0%,30%{transform:translateX(-3.5px)}50%,80%{transform:translateX(3.5px)}100%{transform:translateX(-3.5px)}}
@keyframes m-wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(20deg)}}
@keyframes m-glint{0%,55%{transform:translateX(-30px);opacity:0}65%{opacity:1}85%,100%{transform:translateX(34px);opacity:0}}
@keyframes m-brow{0%,60%,100%{transform:translateY(0)}70%,85%{transform:translateY(-5px)}}
@keyframes m-stache{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes m-spin{to{transform:rotate(360deg)}}
@keyframes m-wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes m-drop{0%{transform:translateY(0);opacity:1}80%{transform:translateY(14px);opacity:0}100%{opacity:0}}
@keyframes m-pom{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
